<!doctype html>
<html lang="en" data-theme="mocha">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse trading card catalogs and inspect historical price trends." />
    <title>TCG Viewer</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('tcg-theme');
        var theme = stored === '"latte"' || stored === 'latte' ? 'latte' : null;
        if (!theme) {
          try {
            var raw = localStorage.getItem('tcg-theme');
            var parsed = raw ? JSON.parse(raw) : null;
            theme = parsed && parsed.state && parsed.state.theme ? parsed.state.theme : null;
          } catch (e) {}
        }
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'latte'
              : 'mocha';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
