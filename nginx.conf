# nginx config for tcg-frontend (SvelteKit adapter-static output).
#
# adapter-static prerenders /, /releases, /updates, /about to HTML
# files and emits 404.html as the fallback. Every unknown path
# falls back to /404.html so hard refreshes work.
#
# /api/* is NOT served by this nginx. The `tcg-frontend-api`
# traefik router in compose.yml (priority 100) intercepts /api/*
# requests and forwards them to the Go API service before they
# reach this container. If a /api/ request ever does reach this
# nginx, the explicit `location /api/` block returns 404 so the
# failure is loud instead of serving HTML to a JSON client.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed immutable assets — cache forever.
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML entry points — no cache, so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /404.html {
        add_header Cache-Control "no-store";
    }

    # Defensive: /api/ must be routed via traefik, never this nginx.
    location /api/ {
        return 404 "Not Found: /api/ must be routed via traefik (see tcg-frontend-api router)";
        add_header Content-Type "text/plain";
    }

    # Prerendered routes + static fallback.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
